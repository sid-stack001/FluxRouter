[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxrouter"
version = "0.1.0"
description = "Complexity-aware LLM routing proxy — classify, cascade, orchestrate."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Siddharth Verma", email = "siddharthv643@gmail.com"}]
keywords = ["llm", "routing", "cascade", "groq", "ai-proxy", "llm-router"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "groq>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "aiofiles>=24.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/sid-stack001/FluxRouter"
Repository = "https://github.com/sid-stack001/FluxRouter"
Issues = "https://github.com/sid-stack001/FluxRouter/issues"

[project.scripts]
fluxrouter = "fluxrouter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fluxrouter*", "router*", "api*", "static*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.jpg", "*.png", "*.css", "*.js", "*.yaml", "*.json"]


