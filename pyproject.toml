[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxrouter"
version = "0.4.0"
description = "Complexity-aware LLM routing proxy — classify, cascade, orchestrate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "groq>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "aiofiles>=24.0",
    "httpx>=0.27",
]

[project.scripts]
fluxrouter = "fluxrouter.cli:main"

[tool.setuptools.packages.find]
# Discover both the CLI package and the existing router/ api/ packages
where = ["."]
include = ["fluxrouter*", "router*", "api*"]
